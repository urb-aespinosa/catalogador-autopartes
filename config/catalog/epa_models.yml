# Equivalences (D19, D21, D22): our (make, model) → EPA fueleconomy.gov model
# names (db/reference/epa/vehicles_scope.csv). Reviewed by the developer.
#
# Why completeness matters: EPA refutes an engine when none of the mapped
# configurations of that model-year matches it (Task 5), so a mapping that
# misses part of a model line would refute engines that did exist. A model
# that is not here simply has no EPA evidence (no refutation).
#
# models (D21):
# - Generic name (no capacity) → every EPA series of that line: drive
#   variants (2WD/4WD/AWD), GM codes (C15/K15, C10/K10, C1500/K1500), Classic,
#   Hybrid, XFE, LD, Cab Chassis, performance trims (CTS-V, Z06). Never other
#   models that share a word (Escalade ESV/EXT, Yukon XL, TrailBlazer EXT,
#   Envoy XL/XUV, City Express, Grand Am) nor electric versions.
# - 1500 name → the same light-duty series. EPA only rates light-duty
#   vehicles (heavy-duty 2500/3500 HD pickups and vans are out of its scope),
#   so every EPA series of the line is 1500-class, except those that say
#   another capacity ("Silverado 2500 2WD", "Express 2500 2WD Cargo").
# - 2500 / 3500 / HD name → only the EPA series that say that capacity
#   ("1500/2500" counts for both). None → no entry, so HD stays unverified.
# - Mexican-only names (Estaquitas, Ichivan) and models EPA does not list
#   (Hummer H2, Nissan Silvia, Terrano, 280ZX) have no entry.
#
# confirm_only / confirm_only_years (D22): EPA may refute an engine only where
# its coverage of that line is complete. These entries confirm the engine and
# supply fuel and evidence, but never delete a row: a mismatch keeps the row
# and Validación records "difiere".
#
# Every name exists in the extract and every confirm_only entry is a mapped
# model (checked by test/services/catalog/epa_test.rb).

