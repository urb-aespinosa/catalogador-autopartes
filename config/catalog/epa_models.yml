    - Yukon XL 2500    # (a)

# D22: reviewed gaps in EPA's data (the engine existed but EPA does not list
# it), each keyed by model · year · engine so it protects only that case, with
# its reason. The row is kept as "difiere", never as confirmed.
confirm_only_years:
  - make: Cadillac
    model: CTS
    year: 2009
    liters: 6.2
    cylinders: 8
    reason: "CTS-V 2009 (6.2L V8 supercharged) existed; EPA lists the CTS-V only from 2010"
  - make: GMC
    model: Yukon XL 1500
    year: 2007
    liters: 6.2
    cylinders: 8
    reason: "Yukon XL Denali 2007 had the 6.2L; EPA 2007 seems to group Denali and Denali XL as \"Yukon Denali 1500 AWD\" (it lists Yukon XL 1500 with 6.2 from 2008)"
